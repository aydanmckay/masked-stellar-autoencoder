  ft_datafile: '$SCRATCH/msa/data/ftset_spec_ga_realmags.fits'
  classes: ['teff','e_teff','logg','e_logg','fe_h','e_fe_h','alpha','e_alpha','age','e_age']

model:
  layer_dims: [2048, 2048, 1024, 1024, 512, 512, 256, 256]
  pt_activ_func: 'elu'
  norm: 'layer'
  rtdl_embed: 16
  # decoder_dims: [256, 512, 1024]  # Optional: asymmetric decoder (default: mirrors encoder)
  saved_weights: '$SCRATCH/msa/checkpoints/pretrain_latest.pth'

training:
  xp_masking_ratio: 0.9
  m_masking_ratio: 0.6
  lr: 0.00001
  weight_decay: 0.00001
  lasso: 0
  optimizer: 'adamw'
  loss_fn: 'mae'
  mini_batch_size: 1024
  epochs: 100

# Recommended for new Narval science runs (see docs/METHODOLOGY.md).
preprocessing:
  astrometry_input_policy: snr_clipped
  astrometry_snr_cap: 10.0
  parallax_target_space: log10_mas
  parallax_floor_mas: 1.0e-4

# Encoder LR defaults to training.lr when encoder_lr is null (see finetune.yaml).
finetuning:
  num_epochs: 101
  mini_batch: 512
  linearprobe: false
  mask: true
  multitask: true
  rncloss: false
  lr: 0.0001
  encoder_lr: null
  lr_scheduler_encoder_decay: 0.95
  lr_scheduler_head_decay: 0.5
  lr_scheduler_head_step_epochs: 10
  opt: 'adamw'
  activ: 'relu'
  l2: 0.0
  lf: 'quantile'
  pert_features: true
  pert_scale: 1.0
  pert_ebv_scale: 1.0
  pert_labels: false
  ensemble: true
  seed: 42
  pert_seed: 42
  ensemble_path: '$SCRATCH/msa/checkpoints/pretrain_latest.pth'
  # Match paper Eq. total loss: lambda_pred * L_pred + lambda_rec * L_rec
  lambda_pred: 0.8
  lambda_rec: 0.2
  ensemble_seed: 42
  ensemble_size: 20
  # Optional: [Teff, log g, [Fe/H], [alpha/Fe], age, parallax] — up-weight [Fe/H] (index 2) for metal-poor focus
  quantile_label_weights: null
  # Optional: confident labels + preserve rare [Fe/H] in splits; enable for VMP-focused training
  metal_poor:
    stratify_feh: false
    feh_stratify_bins: [-10.0, -2.0, -1.0, 0.0, 10.0]
    require_finite_e_fe_h: false
    max_e_fe_h: null
    min_teff: null
    max_teff: null
    augment_below_feh: null
    augment_fraction: 0.0

saving:
  model_str: '$SCRATCH/msa/runs/ft/masked_stellar_autoencoder_ft.pth'
  log_file: '$SCRATCH/msa/runs/ft/finetune_msa.log'
  checkpoint_interval: 50
