name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cheap pre-commit first so trivial lint/format/ruff issues never start a Pixi + pytest job.
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install "pre-commit>=4,<5"
      - name: Run pre-commit (all files)
        env:
          SKIP: ci-tests
        run: pre-commit run --all-files --show-diff-on-failure --color always

  test:
    needs: pre-commit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for private repos
        if: matrix.python-version == '3.12'
        run: git config --global url."https://x-access-token:${{ secrets.PAT_FOR_PRIVATE_REPOS }}@github.com/".insteadOf "https://github.com/"
      - uses: prefix-dev/setup-pixi@v0.8.0
        if: matrix.python-version == '3.12'
        with:
          pixi-version: latest
      - name: Install (frozen, Python 3.12)
        if: matrix.python-version == '3.12'
        run: pixi install --frozen
      - name: Test (Python 3.12)
        if: matrix.python-version == '3.12'
        run: pixi run --frozen test
      - uses: actions/setup-python@v5
        if: matrix.python-version == '3.14'
        with:
          python-version: "3.14"
      - name: Pure-Python tests on Python 3.14
        if: matrix.python-version == '3.14'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyyaml scikit-learn scipy h5py astropy pytest pytest-mock
          python -m compileall -q src data
          python -m pytest tests/test_config_paths.py tests/test_conformal.py \
            tests/test_finetune_data.py tests/test_feature_noise.py \
            tests/test_calibrate_conformal.py tests/test_finetune_msa_helpers.py \
            tests/test_data_validator.py tests/test_checkpoint_keys.py \
            tests/test_astrometry_features.py -q
