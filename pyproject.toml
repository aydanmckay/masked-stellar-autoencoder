[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "masked-stellar-autoencoder"
version = "0.1.0"
description = "Masked Stellar Autoencoder for XP spectra"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.25.0",
    "astropy>=6.0.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "h5py>=3.10.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.1",
    "wandb>=0.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.tasks]
lint = "ruff check ."
format = "ruff format ."
test = "PYTHONPATH=src/masked_stellar_autoencoder:src/masked_stellar_autoencoder/data:src/masked_stellar_autoencoder/training:src/masked_stellar_autoencoder/utils pytest tests/"

[tool.pixi.dependencies]
python = "3.12.*"
pytorch = ">=2.1.0"
numpy = ">=1.25.0"
astropy = ">=6.0.0"
pandas = ">=2.1.0"
scikit-learn = ">=1.3.0"
scipy = ">=1.11.0"
h5py = ">=3.10.0"
matplotlib = ">=3.8.0"
tqdm = ">=4.66.0"
pyyaml = ">=6.0.1"
wandb = ">=0.16.0"
ruff = "*"
pytest = "*"
pytest-mock = ">=3.15.1,<4"

[tool.pixi.pypi-dependencies]
masked-stellar-autoencoder = { path = ".", editable = true }
rtdl_num_embeddings = ">=0.0.12"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM"]
ignore = [
    "E501", "B008", "SIM115", "SIM108", "B904", "B007", "SIM102", "B028", "B006",
    "SIM105", "SIM101", "B023", "SIM118", "B018", "SIM117", "SIM210", "E402",
    "SIM103", "B011", "B017", "B024", "SIM113", "E731", "F821", "B905"
]
