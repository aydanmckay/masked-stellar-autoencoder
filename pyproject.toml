[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "masked-stellar-autoencoder"
version = "0.1.0"
description = "Masked Stellar Autoencoder for XP spectra"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.25.0",
    "astropy>=6.0.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "h5py>=3.10.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.1",
    "wandb>=0.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.tasks]
lint = "ruff check ."
format = "ruff format ."
test = "pytest tests/"
# Fast gate: hooks only (pytest is separate via `ci-tests` skip — see pre-commit config).
ci-precommit = "SKIP=ci-tests pre-commit run --all-files --color always"
# Same sequence as .github/workflows CI test job + pre-commit parity. Inner
# `pre-commit run` skips `ci-tests` so pytest is not run twice (that hook runs on commit).
ci = "SKIP=ci-tests pre-commit run --all-files --color always && pytest tests/"

[tool.pixi.environments]
gpu = { features = ["gpu"] }

[tool.pixi.dependencies]
python = "3.13.*"
pytorch = ">=2.1.0"
numpy = ">=1.25.0"
astropy = ">=6.0.0"
pandas = ">=2.1.0"
scikit-learn = ">=1.3.0"
scipy = ">=1.11.0"
h5py = ">=3.10.0"
matplotlib = ">=3.8.0"
tqdm = ">=4.66.0"
pyyaml = ">=6.0.1"
wandb = ">=0.16.0"
ruff = "*"
pytest = "*"
pytest-mock = ">=3.15.1,<4"

[tool.pixi.feature.gpu.target.linux-64.dependencies]
cuda-version = ">=12.4"

[tool.pixi.feature.gpu.tasks]
train = "python -u -m masked_stellar_autoencoder.training.pretrain_msa --config configs/pretrain.canfar.yaml"

[tool.pixi.pypi-dependencies]
masked-stellar-autoencoder = { path = ".", editable = true }
rtdl_num_embeddings = ">=0.0.12"
pre-commit = ">=4,<5"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP"]
ignore = [
    "E501", "B008", "SIM115", "SIM108", "B904", "B007", "SIM102", "B028", "B006",
    "SIM105", "SIM101", "B023", "SIM118", "B018", "SIM117", "SIM210", "E402",
    "SIM103", "B011", "B017", "B024", "SIM113", "E731", "F821", "B905"
]
